[package]
name = "un-bien-relay"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "un-bien relay: owner-signed mesh/session relay (WebSocket + SQLite membership authorization)."
license = "MIT"
repository = "https://github.com/georgeharker/un-bien"
homepage = "https://docs.georgeharker.com/un-bien"
readme = "README.md"
keywords = ["relay", "websocket", "mesh", "agent", "authentication"]
categories = ["network-programming", "web-programming::websocket", "authentication"]

# Keep the internal crate/lib name `relay` (main.rs + tests use `relay::…`) while
# the published package is `un-bien-relay`.
[lib]
name = "relay"

# Binary name follows the TYPED-surface convention — `unbien*`, like the
# `unbien` (extension) and `unbien-launcher` bins and the `/unbien` commands —
# while the published crate keeps the NAMED-surface `un-bien-relay` (npm scope
# / crate / dirs are hyphenated like the project name).
[[bin]]
name = "unbien-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.7.9", features = ["ws"] }
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.32"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio-tungstenite = "0.29.0"
