packages:
  - extension
  - launcher
  - unbien-cli
  - unbien-durable
  - ../../toucan

# Native deps whose install build scripts pnpm (v10+) blocks by default. These
# are trusted first-party build tools, allowed to run. Moved here from
# extension/package.json's `pnpm` field when the workspace was introduced.
allowBuilds:
  "@google/genai": true
  esbuild: true
  koffi: true
  protobufjs: true
# Optional native binaries to install: the machine running the install
# (`current` — e.g. the x64 CI runners, whose vitest needs its rolldown
# binding) plus darwin/linux arm64 for the docker image builds.
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - current
    - arm64
shamefullyHoist: true
confirmModulesPurge: false
