---
name: UnBien
options:
  bundleIdPrefix: com.georgeharker.un-bien
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  UnBien:
    path: .

targets:
  UnBien-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
    dependencies:
      - package: UnBien
        product: UnBienApp
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Un Bien
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan a pairing QR code.
        # Deep link: system Camera / links open `unbien://pair?…` into the app,
        # which then presents the relay chooser (the QR carries no relay).
        CFBundleURLTypes:
          - CFBundleURLName: com.georgeharker.un-bien.pair
            CFBundleURLSchemes: [unbien]
        # Relays are USER-SPECIFIED plaintext ws:// endpoints — localhost, LAN,
        # Tailnet (100.64/10 CGNAT — NOT RFC1918, so NSAllowsLocalNetworking
        # does NOT cover it; verified by the 2026-08-31 tailscale regression
        # that severed every phone pairing), or a self-hosted VPS. The endpoint
        # set is unknowable at build time, so arbitrary loads is the honest
        # posture, with a written justification in the App Review notes — the
        # standard stance for user-configured self-hosted-server clients (SSH
        # / home-automation class). Long-term tightening: wss:// relays
        # (tailscale serve issues ts.net certs) would allow revisiting this.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS 14+ prompts for this on the first LAN connection to a relay —
        # missing description is an App Review rejection.
        NSLocalNetworkUsageDescription: >-
          Un Bien connects to relays on your local network to reach the
          machines running your agents.
        # REQUIRED for universal (iPhone+iPad) apps — the upload processor
        # rejects the bundle without orientation declarations. iPad declares
        # ALL FOUR (multitasking/Split View support); iPhone omits only
        # upside-down portrait (standard).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CryptoKit (Ed25519) + TLS only — standard/exempt crypto, declared so
        # uploads don't prompt for export compliance every time.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "16"
    entitlements:
      path: App/iOS/un-bien.entitlements
      properties:
        # Data-protection keychain access group (Owner-key custody). Gates
        # keychain access by entitlement so macOS stops the per-launch ACL
        # prompt. `$(AppIdentifierPrefix)` expands to the team's App ID prefix.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.georgeharker.un-bien.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeharker.un-bien.app
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The bundle FILENAME is the device-displayed name on macOS
        # (Guideline 5.2.5: the .app must not contain "macOS").
        PRODUCT_NAME: Un Bien
        # Module name stays the XcodeGen default, so imports don't shift.
        PRODUCT_MODULE_NAME: UnBien
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pinned here (the source of truth) so `xcodegen generate` doesn't wipe
        # signing set by hand in Xcode. Team B8V3694RNX (George Harker).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B8V3694RNX
      configs:
        # Diagnostics are OPT-IN so the shipping configuration is what you get
        # by doing nothing. Device profiling builds Release (it needs the
        # shipping optimization level), so `#if DEBUG` would strip the HUD from
        # exactly the builds it exists for — scripts/build-iphone.sh injects
        # this condition into its Release build instead. An App Store archive
        # defines nothing and compiles the diagnostics out.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG UNBIEN_DIAGNOSTICS

  # Keychain regression suite (issue #2) run INSIDE the app's entitlement:
  # an unsigned `swift test` CLI process has no data-protection-keychain
  # entitlement, so the SPM test bundle can only SKIP those tests there
  # (see tryRequireDPKeychain). Hosting the same test file in the app's
  # test host on the simulator gives the REAL proof — save() → restart →
  # load() must round-trip. Run: xcodebuild test -scheme UnBien-iOS
  # -only-testing:UnBienCoreTestsHost -destination '<simulator>'
  UnBienCoreTestsHost:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/UnBienCoreTests/KeychainOwnerIdentityStoreTests.swift
    dependencies:
      - target: UnBien-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeharker.un-bien.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B8V3694RNX
        # PRODUCT_NAME is "Un Bien" (with a space) — the auto TEST_HOST
        # resolves the module name, so pin the host path explicitly.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Un Bien.app/Un Bien
        BUNDLE_LOADER: $(TEST_HOST)

  UnBien-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
    dependencies:
      - package: UnBien
        product: UnBienApp
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Un Bien
        LSMinimumSystemVersion: "15.0"
        NSCameraUsageDescription: Scan a pairing QR code.
        CFBundleURLTypes:
          - CFBundleURLName: com.georgeharker.un-bien.pair
            CFBundleURLSchemes: [unbien]
        # User-specified relay endpoints (localhost / LAN / Tailnet CGNAT /
        # self-hosted VPS) — same arbitrary-loads posture + review-notes
        # justification as the iOS target (Tailnet 100.64/10 is not RFC1918;
        # NSAllowsLocalNetworking does not cover it).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # CryptoKit (Ed25519) + TLS only — exempt crypto, declared to avoid the
        # per-upload export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        # REQUIRED for Mac App Store submission — the upload processor rejects
        # the archive without the category UTI. Matches the ASC record's
        # primary category (Developer Tools).
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "16"
    entitlements:
      path: App/macOS/un-bien.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.georgeharker.un-bien.app
        # Mac App Store REQUIRES the sandbox. Network CLIENT only (outbound
        # WebSocket; no server entitlement) — see APPSTORE.md + DEPLOY.md.
        # Re-test Keychain + relay connect under sandbox before submission.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeharker.un-bien.app
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: "YES"
        # The bundle FILENAME is the device-displayed name on macOS
        # (Guideline 5.2.5: the .app must not contain "macOS").
        PRODUCT_NAME: Un Bien
        # Module name stays the XcodeGen default, so imports don't shift.
        PRODUCT_MODULE_NAME: UnBien
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B8V3694RNX
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG UNBIEN_DIAGNOSTICS

schemes:
  UnBien-macOS:
    build:
      targets:
        UnBien-macOS: all
  UnBien-iOS:
    build:
      targets:
        UnBien-iOS: all
    test:
      targets:
        - UnBienCoreTestsHost
