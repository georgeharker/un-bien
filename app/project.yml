---
name: UnBien
options:
  bundleIdPrefix: com.georgeharker.un-bien
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  UnBien:
    path: .

targets:
  UnBien-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
    dependencies:
      - package: UnBien
        product: UnBienApp
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: un-bien
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan a pairing QR code.
        # Deep link: system Camera / links open `unbien://pair?…` into the app,
        # which then presents the relay chooser (the QR carries no relay).
        CFBundleURLTypes:
          - CFBundleURLName: com.georgeharker.un-bien.pair
            CFBundleURLSchemes: [unbien]
        # Relays are user-specified plaintext ws:// endpoints on private
        # networks (localhost / LAN / Tailnet) — allow non-TLS loads.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/iOS/un-bien.entitlements
      properties:
        # Data-protection keychain access group (Owner-key custody). Gates
        # keychain access by entitlement so macOS stops the per-launch ACL
        # prompt. `$(AppIdentifierPrefix)` expands to the team's App ID prefix.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.georgeharker.un-bien.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeharker.un-bien.app
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pinned here (the source of truth) so `xcodegen generate` doesn't wipe
        # signing set by hand in Xcode. Team B8V3694RNX (George Harker).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B8V3694RNX

  UnBien-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
    dependencies:
      - package: UnBien
        product: UnBienApp
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: un-bien
        LSMinimumSystemVersion: "14.0"
        NSCameraUsageDescription: Scan a pairing QR code.
        CFBundleURLTypes:
          - CFBundleURLName: com.georgeharker.un-bien.pair
            CFBundleURLSchemes: [unbien]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/macOS/un-bien.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.georgeharker.un-bien.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.georgeharker.un-bien.app
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B8V3694RNX
