project:
  type: website
  # Force-ship the OG card — the absolute og:image URL below can't be mapped
  # to a local file, so Quarto wouldn't copy it into the deployment.
  resources:
    - docs/images/og-card.png
  render:
    - index.md
    - README.md # README files must be listed explicitly; globs skip them
    - docs/install.md
    - docs/homebrew.md
    - docs/app-guide.md
    - docs/changelog.md
    - docs/privacy.md
    - extension/README.md
    - extension/docs/daemon.md
    - relay/README.md
    - launcher/README.md
    - unbien-cli/README.md
    - docs/design.md
    - DESIGN.md
    - docs/rpc-envelope.md
    - docs/rpc-on-event-map.md
    - docs/subagent-events.md
    - docs/identity.md

# gfm_auto_identifiers makes heading anchors match GitHub's slugs, which the
# docs' cross-links use. Keep pandoc's full markdown reader otherwise —
# `from: gfm` breaks Quarto's navigation divs.
from: markdown+gfm_auto_identifiers

website:
  title: "un-bien"
  description: "Mobile remote control + local agent mesh for the Pi agent."
  favicon: app/icons/un-bien.svg
  site-url: https://docs.georgeharker.com/un-bien
  # Social link previews (Reddit/Slack/Discord/iMessage read Open Graph tags).
  # Image is pinned to the /main deployment (the evergreen branch docs) —
  # each branch/tag deploy ships its own copy under its own subpath.
  open-graph:
    image: https://docs.georgeharker.com/un-bien/main/docs/images/og-card.png
    locale: en_US
  twitter-card: true
  search: true
  repo-url: https://github.com/georgeharker/un-bien
  sidebar:
    style: docked
    logo: app/icons/un-bien.svg
    tools:
      - icon: github
        href: https://github.com/georgeharker/un-bien
        text: GitHub repository
    contents:
      - text: "Home"
        href: index.md
      - text: "Overview (README)"
        href: README.md
      - text: "Install & setup"
        href: docs/install.md
      - text: "App guide"
        href: docs/app-guide.md
      - text: "Changelog"
        href: docs/changelog.md
      - text: "Privacy policy"
        href: docs/privacy.md
      - section: "Extension"
        href: extension/README.md
        contents:
          - text: "Extension guide"
            href: extension/README.md
          - text: "Remote launch & troubleshooting"
            href: extension/docs/daemon.md
      - section: "Design & development"
        href: docs/design.md
        contents:
          - text: "Overview"
            href: docs/design.md
          - text: "Architecture & design"
            href: DESIGN.md
          - text: "rpc-envelope protocol"
            href: docs/rpc-envelope.md
          - text: "pi.on() ↔ frame map"
            href: docs/rpc-on-event-map.md
          - text: "Subagent & plan bus events"
            href: docs/subagent-events.md
          - text: "Machine identity"
            href: docs/identity.md
      - section: "Reference"
        contents:
          - text: "Self-host the relay"
            href: relay/README.md
          - text: "Homebrew relay installation"
            href: docs/homebrew.md
          - text: "Machine launcher daemon"
            href: launcher/README.md
          - text: "Terminal client (CLI)"
            href: unbien-cli/README.md

format:
  html:
    theme: pulse
    toc: true
    embed-resources: true
