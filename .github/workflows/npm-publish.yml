---
name: Publish Package

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm
          # Workspace root lockfile (the per-package
          # extension/pnpm-lock.yaml was retired for the workspace).
          cache-dependency-path: pnpm-lock.yaml
          # No registry-url: it writes an .npmrc expecting
          # NODE_AUTH_TOKEN, shadowing OIDC (publish would 404).

      - run: npm install -g npm@latest

      # Install the whole workspace from the root lockfile, then
      # build/test + publish just the extension.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension build
      - run: pnpm -C extension test
      # Pre-release versions (containing '-') publish under the `dev` tag,
      # not `latest` — so a dev release doesn't override the stable release.
      - name: Detect pre-release
        id: prerelease
        working-directory: extension
        run: |
          VER=$(node -p "require('./package.json').version")
          if echo "$VER" | grep -q '-'; then
            echo "tag=--tag dev" >> "$GITHUB_OUTPUT"
            echo "pre-release $VER -> publishing under 'dev' tag"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @geohar/un-bien
        working-directory: extension
        run: npm publish --provenance --access public ${{ steps.prerelease.outputs.tag }}
