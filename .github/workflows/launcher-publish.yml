---
name: Publish Launcher

"on":
  push:
    tags:
      # Component-scoped: extension publishes on `v*`, relay on
      # `relay-v*`, launcher on `launcher-v*` — one tag never
      # publishes two packages.
      - "launcher-v*"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: npm install -g npm@latest

      # The launcher is a thin wrapper over @geohar/un-bien/launcher;
      # build the extension first so the shim's import type resolves.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension build
      - run: pnpm -C launcher build

      # `pnpm publish` rewrites the `workspace:^` dep on @geohar/un-bien
      # to the concrete published version (npm publish can't).
      # Pre-release versions (containing '-') publish under the `dev` tag.
      - name: Detect pre-release
        id: prerelease
        working-directory: launcher
        run: |
          VER=$(node -p "require('./package.json').version")
          if echo "$VER" | grep -q '-'; then
            echo "tag=--tag dev" >> "$GITHUB_OUTPUT"
            echo "pre-release $VER -> publishing under 'dev' tag"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @geohar/un-bien-launcher
        working-directory: launcher
        run: pnpm publish --provenance --access public --no-git-checks ${{ steps.prerelease.outputs.tag }}
